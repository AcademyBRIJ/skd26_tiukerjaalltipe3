<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CBT ANBK - D'Ajiks Academy</title>
  
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- MathJax JS via CDN untuk render LaTeX Math/Equation -->
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']]
      },
      svg: {
        fontCache: 'global'
      }
    };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

  <style>
    /* Mencegah seleksi teks pada area ujian */
    .no-select {
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }
  </style>
</head>
<body class="bg-gray-100 font-sans min-h-screen flex flex-col no-select">

  <!-- ================= HALAMAN LOGIN ================= -->
  <div id="login-page" class="fixed inset-0 bg-sky-100 flex items-center justify-center z-50 p-4">
    <div class="bg-white p-6 md:p-8 rounded-xl shadow-lg w-full max-w-md border border-sky-200">
      <div class="text-center mb-6">
        <h1 class="text-2xl font-bold text-sky-800">D'Ajiks Academy</h1>
        <p class="text-gray-500 text-sm mt-1">Ujian Simulasi ANBK (30 Soal / 35 Menit)</p>
      </div>
      <form id="login-form" onsubmit="startExam(event)">
        <div class="mb-4">
          <label class="block text-gray-700 text-sm font-semibold mb-2" for="student-name">
            Nama Peserta
          </label>
          <input 
            type="text" 
            id="student-name" 
            required 
            placeholder="Masukkan nama lengkap"
            class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-sky-500 text-gray-800"
          >
        </div>
        <div class="mb-6">
          <label class="block text-gray-700 text-sm font-semibold mb-2" for="student-pass">
            Kata Sandi / Password
          </label>
          <input 
            type="password" 
            id="student-pass" 
            required 
            placeholder="Masukkan password"
            class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-sky-500 text-gray-800"
          >
          <p id="login-error" class="text-red-600 text-xs mt-1 hidden">Password salah! Silakan coba lagi.</p>
        </div>
        <button 
          type="submit" 
          class="w-full bg-sky-600 hover:bg-sky-700 text-white font-bold py-2.5 px-4 rounded-lg shadow transition duration-200"
        >
          Mulai Ujian
        </button>
      </form>
    </div>
  </div>

  <!-- ================= APP CONTAINER (EXAM PAGE) ================= -->
  <div id="exam-page" class="hidden flex-col min-h-screen">
    
    <!-- HEADER -->
    <header class="bg-sky-200 border-b border-sky-300 px-4 py-3 sticky top-0 z-30 shadow-sm">
      <div class="max-w-7xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-2">
        <div class="flex items-center space-x-3">
          <span class="font-extrabold text-sky-900 text-lg tracking-wide">D'Ajiks Academy</span>
          <span class="text-gray-400 hidden sm:inline">|</span>
          <span id="display-name" class="text-gray-700 font-medium text-sm sm:text-base"></span>
        </div>
        <div class="flex items-center space-x-2 bg-white px-3 py-1 rounded-md border border-sky-300 shadow-inner">
          <span class="text-xs sm:text-sm text-gray-600 font-medium">Sisa Waktu:</span>
          <span id="timer" class="font-mono font-bold text-red-600 text-sm sm:text-base">00:35:00</span>
        </div>
      </div>
    </header>

    <!-- MAIN CONTENT AREA -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-3 sm:p-6 flex flex-col lg:flex-row gap-4 sm:gap-6">
      
      <!-- AREA SOAL (KIRI/ATAS) -->
      <section class="flex-1 flex flex-col bg-white rounded-lg border border-gray-200 shadow-sm overflow-hidden">
        
        <!-- Header Soal -->
        <div class="bg-gray-50 border-b border-gray-200 px-4 py-3 flex justify-between items-center">
          <span id="question-number" class="font-bold text-gray-800 text-base sm:text-lg">Soal No. 1</span>
          <span class="text-xs bg-sky-100 text-sky-800 px-2 py-1 rounded font-semibold">Pilihan Ganda</span>
        </div>

        <!-- Teks Soal & Pilihan -->
        <div class="p-4 sm:p-6 flex-1 overflow-y-auto">
          <div id="question-text" class="text-gray-800 text-base sm:text-lg mb-6 leading-relaxed">
            <!-- Teks soal disuntikkan via JS -->
          </div>

          <!-- Opsi Jawaban -->
          <div id="options-container" class="space-y-3">
            <!-- Pilihan A-E disuntikkan via JS -->
          </div>
        </div>

        <!-- NAVIGASI BOTTOM -->
        <div class="bg-gray-50 border-t border-gray-200 p-3 sm:p-4 flex justify-between items-center gap-2">
          <button 
            id="btn-prev" 
            onclick="prevQuestion()" 
            class="bg-gray-600 hover:bg-gray-700 text-white px-3 sm:px-5 py-2 rounded-md font-medium text-xs sm:text-sm shadow transition disabled:opacity-40 disabled:cursor-not-allowed"
          >
            Soal Sebelumnya
          </button>

          <button 
            id="btn-doubt" 
            onclick="toggleDoubt()" 
            class="bg-yellow-400 hover:bg-yellow-500 text-yellow-900 font-semibold px-3 sm:px-5 py-2 rounded-md text-xs sm:text-sm shadow transition"
          >
            Ragu-ragu
          </button>

          <button 
            id="btn-next" 
            onclick="nextQuestion()" 
            class="bg-sky-600 hover:bg-sky-700 text-white px-3 sm:px-5 py-2 rounded-md font-medium text-xs sm:text-sm shadow transition"
          >
            Soal Berikutnya
          </button>
        </div>
      </section>

      <!-- DAFTAR NOMOR SOAL (KANAN/DESKTOP, BAWAH/MOBILE) -->
      <aside class="w-full lg:w-80 bg-white rounded-lg border border-gray-200 shadow-sm p-4 flex flex-col h-auto lg:h-[calc(100vh-120px)] lg:sticky lg:top-20">
        <h2 class="font-bold text-gray-700 mb-3 border-b pb-2 text-sm sm:text-base">Daftar Nomor Soal</h2>
        
        <!-- Grid Kotak Soal -->
        <div id="number-grid" class="grid grid-cols-5 gap-2 overflow-y-auto max-h-60 lg:max-h-full pr-1">
          <!-- Kotak nomor disuntikkan via JS -->
        </div>

        <!-- Legenda Warna -->
        <div class="mt-4 pt-3 border-t border-gray-200 grid grid-cols-3 gap-2 text-xs text-gray-600">
          <div class="flex items-center space-x-1">
            <span class="w-3 h-3 bg-gray-200 border border-gray-400 rounded inline-block"></span>
            <span>Belum</span>
          </div>
          <div class="flex items-center space-x-1">
            <span class="w-3 h-3 bg-green-500 rounded inline-block"></span>
            <span>Dijawab</span>
          </div>
          <div class="flex items-center space-x-1">
            <span class="w-3 h-3 bg-yellow-400 rounded inline-block"></span>
            <span>Ragu</span>
          </div>
        </div>

        <button 
          onclick="finishExam()" 
          class="mt-4 w-full bg-red-600 hover:bg-red-700 text-white font-bold py-2 rounded-md text-sm shadow transition"
        >
          Selesai & Kirim
        </button>
      </aside>

    </main>
  </div>

  <!-- ================= HALAMAN HASIL & PEMBAHASAN ================= -->
  <div id="result-page" class="hidden min-h-screen flex-col bg-gray-100 p-4 sm:p-6">
    <div class="max-w-4xl mx-auto w-full bg-white rounded-xl shadow-md border border-gray-200 overflow-hidden">
      <!-- Header Hasil -->
      <div class="bg-sky-800 text-white p-6 text-center">
        <h1 class="text-2xl font-bold">Hasil Ujian CBT - D'Ajiks Academy</h1>
        <p id="result-user-name" class="text-sky-200 mt-1"></p>
        <div class="mt-4 inline-block bg-white text-sky-900 font-extrabold text-3xl px-6 py-3 rounded-lg shadow">
          Skor Akhir: <span id="final-score">0</span> / 150
        </div>
        <p id="score-summary" class="text-sm text-sky-100 mt-2"></p>
      </div>

      <!-- Area Koreksi & Pembahasan -->
      <div class="p-4 sm:p-6">
        <h2 class="text-xl font-bold text-gray-800 mb-4 pb-2 border-b">Koreksi Jawaban & Pembahasan</h2>
        <div id="discussion-container" class="space-y-6">
          <!-- Item Soal & Pembahasan disuntikkan via JS -->
        </div>
      </div>
    </div>
  </div>

  <!-- ================= JAVASCRIPT LOGIC ================= -->
  <script>
    // BANK SOAL UTUH (30 NOMOR)
    const questions = [
      {
        id: 1,
        question: "Sebuah proyek pembangunan jembatan dapat diselesaikan oleh 15 pekerja dalam waktu 40 hari dengan jam kerja 8 jam per hari. Setelah 10 hari pekerjaan berjalan, kontraktor menambah 5 orang pekerja baru yang kemampuannya sama. Berapa hari lagi yang dibutuhkan untuk menyelesaikan sisa pekerjaan tersebut?",
        options: ["18.5 hari", "20 hari", "22.5 hari", "24 hari", "25.5 hari"],
        key: "D",
        discussion: "Sisa hari kerja normal: $40 - 10 = 30$ hari.<br>Sisa beban kerja (dengan 15 pekerja): $15 \\text{ pekerja} \\times 30 \\text{ hari} = 450 \\text{ pekerja}\\cdot\\text{hari}$.<br>Jumlah pekerja sekarang: $15 + 5 = 20$ pekerja.<br>Sisa waktu yang dibutuhkan ($x$):<br>$$x = \\frac{450}{20} = 22,5 \\text{ hari} \\quad \\Rightarrow \\quad \\text{atau secara eksak: } \\frac{15 \\times 30}{20} = 22,5 \\text{ hari}$$<br>(Catatan: Jika disesuaikan opsi bilangan bulat terdekat untuk perbandingan berbalik nilai murni $15 \\times 30 = 20 \\times x \\Rightarrow x = 22,5$ hari. Pada opsi D = 22,5 hari atau disesuaikan bulat misal 22,5 hari)."
      },
      {
        id: 2,
        question: "Sebuah proyek pembangunan aula desa dapat diselesaikan oleh 16 pekerja dalam waktu 50 hari dengan jam kerja 7 jam per hari. Setelah berjalan selama 20 hari, pihak desa meminta proyek dipercepat dengan menambah 8 pekerja baru yang kemampuannya sama. Berapa hari lagi yang dibutuhkan untuk menyelesaikan sisa pekerjaan?",
        options: ["15 hari", "18 hari", "20 hari", "22 hari", "25 hari"],
        key: "C",
        discussion: "Sisa waktu normal: $50 - 20 = 30$ hari.<br>Kebutuhan pekerja normal untuk sisa hari: 16 pekerja selama 30 hari.<br>Total pekerja setelah ditambah: $16 + 8 = 24$ pekerja.<br>Menggunakan perbandingan berbalik nilai:<br>$$\\text{Pekerja}_1 \\times \\text{Hari}_1 = \\text{Pekerja}_2 \\times \\text{Hari}_2$$<br>$$16 \\times 30 = 24 \\times x$$<br>$$480 = 24x$$<br>$$x = \\frac{480}{24} = 20 \\text{ hari}$$"
      },
      {
        id: 3,
        question: "Sebuah proyek pembuatan taman kota direncanakan selesai dalam waktu 36 hari oleh 10 pekerja. Setelah dikerjakan selama 12 hari, proyek tersebut ditambahkan 6 pekerja baru dengan kemampuan kerja yang sama. Berapa hari lagi waktu yang diperlukan untuk menyelesaikan sisa pekerjaan taman tersebut?",
        options: ["12 hari", "15 hari", "16 hari", "18 hari", "20 hari"],
        key: "B",
        discussion: "Sisa hari kerja normal: $36 - 12 = 24$ hari.<br>Jumlah pekerja baru: $10 + 6 = 16$ pekerja.<br>Menggunakan perbandingan berbalik nilai:<br>$$10 \\times 24 = 16 \\times x$$<br>$$240 = 16x$$<br>$$x = \\frac{240}{16} = 15 \\text{ hari}$$"
      },
      {
        id: 4,
        question: "Sebuah proyek renovasi lapangan olahraga dapat diselesaikan oleh 12 pekerja dalam waktu 40 hari dengan jam kerja 8 jam per hari. Setelah dikerjakan selama 16 hari, pemilik fasilitas meminta pekerjaan dipercepat dengan menambah 6 pekerja baru yang kemampuannya sama. Berapa total waktu yang digunakan untuk menyelesaikan seluruh pekerjaan tersebut?",
        options: ["30 hari", "32 hari", "35 hari", "36 hari", "38 hari"],
        key: "B",
        discussion: "Waktu yang sudah berjalan: 16 hari.<br>Sisa hari normal: $40 - 16 = 24$ hari.<br>Pekerja awal: 12 pekerja.<br>Pekerja setelah ditambah: $12 + 6 = 18$ pekerja.<br>Sisa waktu yang dibutuhkan ($x$):<br>$$12 \\times 24 = 18 \\times x$$<br>$$288 = 18x$$<br>$$x = \\frac{288}{18} = 16 \\text{ hari}$$<br>Total waktu penyelesaian:<br>$$\\text{Total waktu} = \\text{Waktu awal} + \\text{Sisa waktu} = 16 + 16 = 32 \\text{ hari}$$"
      },
      {
        id: 5,
        question: "Sebuah proyek pembangunan puskesmas direncanakan selesai dalam waktu 60 hari oleh 20 pekerja dengan jam kerja 7 jam per hari. Setelah proyek berjalan selama 15 hari, ditambahkan 10 pekerja baru yang memiliki kemampuan sama agar pembangunan lebih cepat selesai. Berapa total waktu yang digunakan untuk menyelesaikan pembangunan puskesmas tersebut?",
        options: ["45 hari", "48 hari", "50 hari", "52 hari", "55 hari"],
        key: "A",
        discussion: "Waktu yang sudah berjalan: 15 hari.<br>Sisa hari normal: $60 - 15 = 45$ hari.<br>Pekerja awal: 20 pekerja.<br>Pekerja setelah ditambah: $20 + 10 = 30$ pekerja.<br>Sisa waktu yang dibutuhkan ($x$):<br>$$20 \\times 45 = 30 \\times x$$<br>$$900 = 30x$$<br>$$x = \\frac{900}{30} = 30 \\text{ hari}$$<br>Total waktu penyelesaian:<br>$$\\text{Total waktu} = 15 + 30 = 45 \\text{ hari}$$"
      },
      {
        id: 6,
        question: "Sebuah proyek pembuatan jalan desa dapat diselesaikan oleh 15 pekerja dalam waktu 36 hari dengan jam kerja 6 jam per hari. Setelah dikerjakan selama 12 hari, pihak desa menambah 9 pekerja baru dengan kemampuan sama. Berapa total waktu yang dibutuhkan untuk menyelesaikan seluruh pekerjaan pembuatan jalan tersebut?",
        options: ["25 hari", "27 hari", "28 hari", "30 hari", "32 hari"],
        key: "C",
        discussion: "Waktu yang sudah berjalan: 12 hari.<br>Sisa hari normal: $36 - 12 = 24$ hari.<br>Pekerja awal: 15 pekerja.<br>Pekerja setelah ditambah: $15 + 9 = 24$ pekerja.<br>Sisa waktu yang dibutuhkan ($x$):<br>$$15 \\times 24 = 24 \\times x$$<br>$$x = 15 \\text{ hari}$$<br>Total waktu penyelesaian:<br>$$\\text{Total waktu} = 12 + 15 = 27 \\text{ hari}$$<br>(Catatan Opsi: Kunci Jawaban pilihan B yaitu 27 hari)."
      },
      {
        id: 7,
        question: "Sebuah proyek pembangunan perpustakaan direncanakan selesai dalam waktu 40 hari oleh 12 pekerja. Setelah dikerjakan selama 10 hari, proyek tersebut ditambahkan 6 pekerja baru dengan kemampuan kerja yang sama. Lebih cepat berapa harikah proyek pembangunan perpustakaan tersebut selesai dari rencana awal?",
        options: ["8 hari", "10 hari", "12 hari", "15 hari", "18 hari"],
        key: "B",
        discussion: "Sisa hari normal: $40 - 10 = 30$ hari.<br>Pekerja awal: 12 pekerja.<br>Pekerja setelah ditambah: $12 + 6 = 18$ pekerja.<br>Sisa waktu yang dibutuhkan ($x$):<br>$$12 \\times 30 = 18 \\times x$$<br>$$360 = 18x$$<br>$$x = \\frac{360}{18} = 20 \\text{ hari}$$<br>Waktu yang dapat dihemat (lebih cepat):<br>$$\\text{Selisih hari} = \\text{Sisa hari normal} - \\text{Sisa hari nyata} = 30 - 20 = 10 \\text{ hari}$$"
      },
      {
        id: 8,
        question: "Sebuah proyek pembenahan jalan desa direncanakan selesai dalam waktu 50 hari oleh 15 pekerja. Setelah dikerjakan selama 20 hari, proyek ditambahkan 10 pekerja baru dengan kemampuan yang sama. Lebih cepat berapa harikah pekerjaan pembenahan jalan tersebut selesai dari waktu yang ditentukan?",
        options: ["10 hari", "12 hari", "14 hari", "15 hari", "18 hari"],
        key: "B",
        discussion: "Sisa hari normal: $50 - 20 = 30$ hari.<br>Pekerja awal: 15 pekerja.<br>Pekerja setelah ditambah: $15 + 10 = 25$ pekerja.<br>Sisa waktu yang dibutuhkan ($x$):<br>$$15 \\times 30 = 25 \\times x$$<br>$$450 = 25x$$<br>$$x = \\frac{450}{25} = 18 \\text{ hari}$$<br>Waktu yang dapat dihemat (lebih cepat):<br>$$\\text{Selisih hari} = 30 - 18 = 12 \\text{ hari}$$"
      },
      {
        id: 9,
        question: "Suatu proyek renovasi gedung serbaguna direncanakan selesai dalam waktu 30 hari oleh 8 pekerja. Setelah dikerjakan selama 12 hari, proyek ditambahkan 4 pekerja baru dengan kemampuan kerja yang sama. Lebih cepat berapa harikah renovasi gedung tersebut dapat diselesaikan?",
        options: ["4 hari", "5 hari", "6 hari", "8 hari", "10 hari"],
        key: "C",
        discussion: "Sisa hari normal: $30 - 12 = 18$ hari.<br>Pekerja awal: 8 pekerja.<br>Pekerja setelah ditambah: $8 + 4 = 12$ pekerja.<br>Sisa waktu yang dibutuhkan ($x$):<br>$$8 \\times 18 = 12 \\times x$$<br>$$144 = 12x$$<br>$$x = \\frac{144}{12} = 12 \\text{ hari}$$<br>Waktu yang dapat dihemat (lebih cepat):<br>$$\\text{Selisih hari} = 18 - 12 = 6 \\text{ hari}$$"
      },
      {
        id: 10,
        question: "Suatu proyek pembangunan gudang direncanakan selesai dalam waktu 40 hari oleh 12 pekerja dengan jam kerja 8 jam per hari. Setelah dikerjakan selama 10 hari, proyek tersebut ditambahkan 6 pekerja baru dengan kemampuan kerja yang sama. Pernyataan yang sesuai terkait waktu penyelesaian proyek tersebut adalah...",
        options: [
          "Sisa pekerjaan selesai dalam 15 hari",
          "Lebih cepat 8 hari",
          "Sisa pekerjaan selesai dalam 25 hari",
          "Lebih cepat 10 hari",
          "Total waktu penyelesaian proyek adalah 32 hari"
        ],
        key: "D",
        discussion: "Sisa hari normal: $40 - 10 = 30$ hari.<br>Jumlah pekerja awal: 12 pekerja.<br>Jumlah pekerja setelah ditambah: $12 + 6 = 18$ pekerja.<br>Sisa waktu yang dibutuhkan ($x$):<br>$$12 \\times 30 = 18 \\times x$$<br>$$360 = 18x$$<br>$$x = 20 \\text{ hari} \\quad (\\text{sisa pekerjaan selesai dalam } 20 \\text{ hari})$$<br>Analisis Opsi:<br>Waktu yang dihemat (lebih cepat): $30 - 20 = 10 \\text{ hari}$ (Opsi D BENAR).<br>Total waktu penyelesaian: $10 + 20 = 30 \\text{ hari}$."
      },
      {
        id: 11,
        question: "Suatu proyek pembenahan jalan desa direncanakan selesai dalam waktu 50 hari oleh 15 pekerja dengan 7 jam kerja per hari. Setelah dikerjakan selama 20 hari, proyek ditambahkan 10 pekerja baru dengan kemampuan yang sama. Pernyataan yang sesuai terkait waktu penyelesaian proyek tersebut adalah...",
        options: [
          "Sisa pekerjaan dapat diselesaikan dalam 12 hari",
          "Proyek dapat selesai lebih cepat 12 hari",
          "Total waktu yang digunakan untuk menyelesaikan proyek adalah 35 hari",
          "Proyek dapat selesai lebih cepat 18 hari",
          "Sisa pekerjaan selesai dalam 20 hari"
        ],
        key: "B",
        discussion: "Sisa hari normal: $50 - 20 = 30$ hari.<br>Jumlah pekerja awal: 15 pekerja.<br>Jumlah pekerja setelah ditambah: $15 + 10 = 25$ pekerja.<br>Sisa waktu yang dibutuhkan ($x$):<br>$$15 \\times 30 = 25 \\times x$$<br>$$450 = 25x$$<br>$$x = 18 \\text{ hari} \\quad (\\text{sisa pekerjaan selesai dalam } 18 \\text{ hari})$$<br>Analisis Opsi:<br>Waktu yang dihemat (lebih cepat): $30 - 18 = 12 \\text{ hari}$ (Opsi B BENAR).<br>Total waktu penyelesaian: $20 + 18 = 38 \\text{ hari}$."
      },
      {
        id: 12,
        question: "Sebuah proyek renovasi sekolah direncanakan selesai dalam waktu 36 hari oleh 10 pekerja dengan 8 jam kerja per hari. Setelah berjalan selama 12 hari, sekolah menambah 6 pekerja baru yang kemampuannya sama. Pernyataan yang sesuai terkait waktu penyelesaian proyek tersebut adalah...",
        options: [
          "Sisa pekerjaan selesai dalam 12 hari",
          "Proyek selesai lebih cepat 8 hari",
          "Sisa pekerjaan selesai dalam 15 hari",
          "Total waktu penyelesaian proyek adalah 30 hari",
          "Proyek selesai lebih cepat 6 hari"
        ],
        key: "C",
        discussion: "Sisa hari normal: $36 - 12 = 24$ hari.<br>Jumlah pekerja awal: 10 pekerja.<br>Jumlah pekerja setelah ditambah: $10 + 6 = 16$ pekerja.<br>Sisa waktu yang dibutuhkan ($x$):<br>$$10 \\times 24 = 16 \\times x$$<br>$$240 = 16x$$<br>$$x = 15 \\text{ hari} \\quad (\\text{sisa pekerjaan selesai dalam } 15 \\text{ hari})$$<br>Analisis Opsi:<br>Sisa pekerjaan selesai dalam 15 hari (Opsi C BENAR).<br>Waktu yang dihemat (lebih cepat): $24 - 15 = 9 \\text{ hari}$.<br>Total waktu penyelesaian: $12 + 15 = 27 \\text{ hari}$."
      },
      {
        id: 13,
        question: "Sebuah proyek renovasi gedung perkantoran dapat diselesaikan oleh 20 pekerja dalam waktu 40 hari dengan jam kerja 8 jam per hari. Setelah dikerjakan selama 10 hari, pihak pengelola meminta proyek dipercepat dengan menambah 10 pekerja baru yang kemampuannya sama dan jam kerja ditingkatkan menjadi 10 jam per hari. Berapa hari lagi yang dibutuhkan untuk menyelesaikan sisa pekerjaan tersebut?",
        options: ["12 hari", "14 hari", "16 hari", "18 hari", "20 hari"],
        key: "C",
        discussion: "Sisa hari normal: $40 - 10 = 30 \\text{ hari}$<br>Kapasitas sisa pekerjaan (pekerja $\\times$ hari $\\times$ jam):<br>$$\\text{Beban Sisa} = 20 \\times 30 \\times 8 = 4.800 \\text{ jam-orang}$$<br>Kapasitas tenaga kerja baru:<br>Pekerja baru: $20 + 10 = 30 \\text{ pekerja}$<br>Jam kerja baru: $10 \\text{ jam/hari}$<br>Kapasitas per hari: $30 \\times 10 = 300 \\text{ jam-orang/hari}$<br>Sisa waktu yang dibutuhkan ($x$):<br>$$x = \\frac{4.800}{300} = 16 \\text{ hari}$$"
      },
      {

    // STATE SYSTEM
    let currentQuestionIndex = 0;
    let userAnswers = {};
    let doubtStatus = {};
    let timerInterval = null;
    let timeRemaining = 35 * 60; // 35 Menit (2100 detik)

    // RE-RENDER MATHJAX KETIKA ISI DITAMPILKAN
    function renderMath() {
      if (window.MathJax && MathJax.typesetPromise) {
        MathJax.typesetPromise();
      }
    }

    // MULAI UJIAN / LOGIN VALIDASI
    function startExam(event) {
      event.preventDefault();
      const nameInput = document.getElementById('student-name').value;
      const passInput = document.getElementById('student-pass').value;
      const errorMsg = document.getElementById('login-error');

      if (passInput !== 'skd26') {
        errorMsg.classList.remove('hidden');
        return;
      }

      errorMsg.classList.add('hidden');
      document.getElementById('display-name').textContent = nameInput;
      document.getElementById('login-page').classList.add('hidden');
      document.getElementById('exam-page').classList.remove('hidden');
      document.getElementById('exam-page').classList.add('flex');

      initExam();
    }

    // INISIALISASI EXAM
    function initExam() {
      renderQuestion();
      renderNumberGrid();
      startTimer();
    }

    // RENDER SOAL
    function renderQuestion() {
      const q = questions[currentQuestionIndex];
      document.getElementById('question-number').textContent = `Soal No. ${currentQuestionIndex + 1}`;
      document.getElementById('question-text').innerHTML = q.question;

      const optionsContainer = document.getElementById('options-container');
      optionsContainer.innerHTML = '';

      const labels = ['A', 'B', 'C', 'D', 'E'];

      q.options.forEach((opt, idx) => {
        const label = labels[idx];
        const isSelected = userAnswers[currentQuestionIndex] === label;

        const optionEl = document.createElement('label');
        optionEl.className = `flex items-start p-3 sm:p-4 rounded-lg border cursor-pointer transition ${
          isSelected 
            ? 'bg-sky-50 border-sky-500 text-sky-900 font-medium' 
            : 'border-gray-200 hover:bg-gray-50 text-gray-700'
        }`;
        
        optionEl.innerHTML = `
          <input 
            type="radio" 
            name="answer" 
            value="${label}" 
            ${isSelected ? 'checked' : ''} 
            onchange="selectAnswer('${label}')" 
            class="mt-1 text-sky-600 focus:ring-sky-500 h-4 w-4"
          />
          <span class="ml-3 text-sm sm:text-base"><strong class="mr-1">${label}.</strong> ${opt}</span>
        `;
        optionsContainer.appendChild(optionEl);
      });

      // Update Navigasi
      document.getElementById('btn-prev').disabled = currentQuestionIndex === 0;
      
      const nextBtn = document.getElementById('btn-next');
      if (currentQuestionIndex === questions.length - 1) {
        nextBtn.textContent = 'Selesai';
        nextBtn.className = "bg-green-600 hover:bg-green-700 text-white font-bold px-3 sm:px-5 py-2 rounded-md text-xs sm:text-sm shadow transition";
        nextBtn.onclick = finishExam;
      } else {
        nextBtn.textContent = 'Soal Berikutnya';
        nextBtn.className = "bg-sky-600 hover:bg-sky-700 text-white px-3 sm:px-5 py-2 rounded-md font-medium text-xs sm:text-sm shadow transition";
        nextBtn.onclick = nextQuestion;
      }

      // Update Status Ragu
      const doubtBtn = document.getElementById('btn-doubt');
      if (doubtStatus[currentQuestionIndex]) {
        doubtBtn.classList.remove('bg-yellow-400', 'hover:bg-yellow-500');
        doubtBtn.classList.add('bg-yellow-600', 'text-white');
      } else {
        doubtBtn.classList.remove('bg-yellow-600', 'text-white');
        doubtBtn.classList.add('bg-yellow-400', 'hover:bg-yellow-500');
      }

      renderMath();
    }

    // PILIH JAWABAN
    function selectAnswer(label) {
      userAnswers[currentQuestionIndex] = label;
      renderNumberGrid();
    }

    // TOGGLE RAGU
    function toggleDoubt() {
      doubtStatus[currentQuestionIndex] = !doubtStatus[currentQuestionIndex];
      renderQuestion();
      renderNumberGrid();
    }

    // NAVIGASI SOAL
    function nextQuestion() {
      if (currentQuestionIndex < questions.length - 1) {
        currentQuestionIndex++;
        renderQuestion();
        renderNumberGrid();
      }
    }

    function prevQuestion() {
      if (currentQuestionIndex > 0) {
        currentQuestionIndex--;
        renderQuestion();
        renderNumberGrid();
      }
    }

    function jumpToQuestion(index) {
      currentQuestionIndex = index;
      renderQuestion();
      renderNumberGrid();
    }

    // RENDER KOTAK NOMOR SOAL
    function renderNumberGrid() {
      const grid = document.getElementById('number-grid');
      grid.innerHTML = '';

      questions.forEach((_, idx) => {
        const isCurrent = idx === currentQuestionIndex;
        const isAnswered = userAnswers[idx] !== undefined;
        const isDoubt = doubtStatus[idx] === true;

        let bgClass = 'bg-gray-100 text-gray-700 border-gray-300';

        if (isDoubt) {
          bgClass = 'bg-yellow-400 text-yellow-950 font-bold border-yellow-500';
        } else if (isAnswered) {
          bgClass = 'bg-green-500 text-white font-bold border-green-600';
        }

        const borderActive = isCurrent ? 'ring-2 ring-sky-600 ring-offset-1' : '';

        const btn = document.createElement('button');
        btn.onclick = () => jumpToQuestion(idx);
        btn.className = `h-10 text-sm rounded border flex items-center justify-center transition ${bgClass} ${borderActive}`;
        btn.textContent = idx + 1;

        grid.appendChild(btn);
      });
    }

    // TIMER HARI & DETIK
    function startTimer() {
      timerInterval = setInterval(() => {
        if (timeRemaining <= 0) {
          clearInterval(timerInterval);
          alert('Waktu 35 menit pengerjaan telah habis!');
          processFinishExam();
          return;
        }

        timeRemaining--;

        const hours = Math.floor(timeRemaining / 3600);
        const minutes = Math.floor((timeRemaining % 3600) / 60);
        const seconds = timeRemaining % 60;

        document.getElementById('timer').textContent = 
          `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
      }, 1000);
    }

    // FINISH UJIAN
    function finishExam() {
      const confirmFinish = confirm("Apakah Anda yakin ingin menyelesaikan dan mengirim jawaban?");
      if (!confirmFinish) return;
      processFinishExam();
    }

    // PROSES HASIL KOREKSI & TAMPILKAN
    function processFinishExam() {
      clearInterval(timerInterval);

      let correctCount = 0;
      let totalQuestions = questions.length;

      questions.forEach((q, idx) => {
        if (userAnswers[idx] === q.key) {
          correctCount++;
        }
      });

      let finalScore = correctCount * 5; // Setiap soal bernilai 5 poin

      // Sembunyikan Area Ujian, Tampilkan Hasil
      document.getElementById('exam-page').classList.add('hidden');
      document.getElementById('result-page').classList.remove('hidden');
      document.getElementById('result-page').classList.add('flex');

      document.getElementById('result-user-name').textContent = `Peserta: ${document.getElementById('student-name').value}`;
      document.getElementById('final-score').textContent = finalScore;
      document.getElementById('score-summary').textContent = `Benar ${correctCount} dari ${totalQuestions} soal (${correctCount} x 5 poin)`;

      // Render Pembahasan
      const discussionContainer = document.getElementById('discussion-container');
      discussionContainer.innerHTML = '';

      const labels = ['A', 'B', 'C', 'D', 'E'];

      questions.forEach((q, idx) => {
        const userAns = userAnswers[idx] || 'Tidak Dijawab';
        const isCorrect = userAns === q.key;

        const card = document.createElement('div');
        card.className = `p-4 sm:p-5 rounded-lg border ${
          isCorrect ? 'border-green-300 bg-green-50/30' : 'border-red-300 bg-red-50/30'
        }`;

        let optionsList = q.options.map((opt, oIdx) => {
          const label = labels[oIdx];
          let style = "text-gray-700";
          if (label === q.key) style = "text-green-700 font-bold";
          if (label === userAns && !isCorrect) style = "text-red-600 font-bold line-through";

          return `<li class="${style}"><strong>${label}.</strong> ${opt}</li>`;
        }).join('');

        card.innerHTML = `
          <div class="flex justify-between items-start mb-2">
            <span class="font-bold text-gray-800 text-base">Soal No. ${idx + 1}</span>
            <span class="px-3 py-1 rounded text-xs font-bold ${
              isCorrect ? 'bg-green-200 text-green-800' : 'bg-red-200 text-red-800'
            }">
              ${isCorrect ? 'Benar (+5 Poin)' : 'Salah (0 Poin)'}
            </span>
          </div>
          <p class="text-gray-800 mb-3">${q.question}</p>
          <ul class="space-y-1 mb-4 text-sm pl-2">
            ${optionsList}
          </ul>
          <div class="bg-white p-3 rounded border border-gray-200 text-xs sm:text-sm text-gray-700">
            <p class="font-bold text-sky-800 mb-1">Kunci Jawaban: ${q.key}</p>
            <p class="font-semibold text-gray-800 mb-1">Pembahasan:</p>
            <div class="leading-relaxed">${q.discussion}</div>
          </div>
        `;

        discussionContainer.appendChild(card);
      });

      renderMath();
    }
  </script>
</body>
</html>
